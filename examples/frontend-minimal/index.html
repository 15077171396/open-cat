<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容 API 最小示例</title>
<!--
  演示「用后台的内容 API 渲染自己的站点」，刻意不引入框架与构建步骤：
  打开文件、能看懂、能改，就是它的全部目的。

  ⚠️ 内容 API 的边界（一开始写错过的就是这里）：
    匿名可读：首页聚合 / 教程列表 / 教程试读（含章节树）/ 分类 / 公告
    需要登录：教程详情、章节正文（涉及免费时长与付费解锁）
  所以本页默认用 `.../intro` 渲染详情页，只有带了用户 token 才去取正文。

  真实站点请按自己的技术栈重写；这里只保证「看得懂数据是怎么取出来的」。
-->
<style>
  :root { --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#fafafa; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { margin:0 0 4px; font-size:18px; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:20px; margin-top:12px; font-size:13px; color:var(--muted); }
  .stats b { color:var(--fg); font-size:16px; }
  main { display:grid; grid-template-columns:300px 1fr; gap:24px; padding:24px; align-items:start; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .panel h2 { margin:0 0 12px; font-size:14px; color:var(--muted); font-weight:600; }
  .item { padding:10px; border-radius:8px; cursor:pointer; }
  .item:hover { background:var(--bg); }
  .item.active { background:#eff6ff; }
  .item strong { display:block; font-size:14px; }
  .item span { color:var(--muted); font-size:12px; }
  .node { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:14px; }
  .node:hover { background:var(--bg); }
  .node.active { background:#eff6ff; color:var(--accent); }
  article h3 { margin:0 0 4px; font-size:20px; }
  article .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  article .body { border-top:1px solid var(--line); padding-top:16px; }
  .empty { color:var(--muted); font-size:13px; }
  .hint { margin-top:16px; padding:12px; border-radius:8px; background:#fffbeb; border:1px solid #fde68a; font-size:13px; color:#92400e; }
  .hint code { background:#fff; padding:1px 5px; border-radius:4px; }
  .error { padding:16px; border:1px solid #fecaca; background:#fef2f2; color:#b91c1c; border-radius:10px; font-size:14px; }
  .error code { background:#fff; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>内容 API 最小示例</h1>
  <p>数据全部来自 <code id="api-label"></code>，没有构建步骤、没有依赖。</p>
  <div class="stats">
    <div>教程 <b id="stat-tutorials">—</b></div>
    <div>分类 <b id="stat-categories">—</b></div>
    <div>公告 <b id="stat-announcements">—</b></div>
    <div>正文 <b id="stat-mode">匿名</b></div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>教程</h2>
    <div id="list"></div>
  </section>

  <article class="panel" id="detail">
    <p class="empty">正在加载…</p>
  </article>
</main>

<script>
  // 默认指向本机后端；也可 ?api=http://其他地址/api/v1/content 覆盖
  const API = new URLSearchParams(location.search).get('api') || 'http://localhost:8000/api/v1/content'
  // 用户 token（可选）：带上它才能读正文。见 README 的取 token 命令
  const TOKEN = new URLSearchParams(location.search).get('token') || ''
  document.getElementById('api-label').textContent = API
  document.getElementById('stat-mode').textContent = TOKEN ? '已登录' : '匿名'

  const el = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

  /** 统一取数：解信封 + 非 2xx 与 code!==0 都抛错（否则页面会静默空白） */
  async function get(path) {
    const headers = { Accept: 'application/json' }
    if (TOKEN) headers.Authorization = `Bearer ${TOKEN}`
    const res = await fetch(API + path, { headers })
    if (res.status === 401) throw new Error('401 需要登录：正文接口必须带用户 token（见 README）')
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`)
    const body = await res.json()
    if (body.code !== 0) throw new Error(body.message || '接口返回失败')
    return body.data
  }

  function showError(err) {
    el('detail').innerHTML =
      `<div class="error"><strong>取数失败：</strong>${esc(err.message)}<br><br>` +
      `常见原因：后端没启动、地址不对，或后端未允许本页跨域（需在 <code>backend/.env</code> ` +
      `里加 <code>CORS_ORIGINS=http://localhost:8080</code> 后重启）。</div>`
  }

  async function openTutorial(id) {
    // 试读接口匿名可读，且**已含章节树** —— 前台详情页基本只需要它
    const intro = await get(`/tutorials/${id}/intro`)

    el('detail').innerHTML = `
      <h3>${esc(intro.title)}</h3>
      <div class="meta">${esc(intro.category || '未分类')} · 阅读 ${intro.view_count ?? 0} · ${intro.node_count ?? 0} 个章节</div>
      <div class="panel" style="padding:0;border:0">
        ${intro.flat.map((n) => `<div class="node" data-node="${n.id}">${'&nbsp;'.repeat(n.depth * 4)}${esc(n.title)}</div>`).join('')}
      </div>
      <div class="body" id="node-body">${esc(intro.introduction || '').replace(/\n/g, '<br>') || '<p class="empty">暂无简介</p>'}</div>
      ${TOKEN ? '' : '<div class="hint">当前是<b>匿名</b>视角：只能看简介与章节标题。正文接口需要登录 —— 在地址后加 <code>&amp;token=用户token</code> 即可，token 的取法见 README。</div>'}`

    // 点章节：有 token 才去取正文；匿名时给出明确提示而不是静默失败
    el('detail').querySelectorAll('.node').forEach((row) => {
      row.addEventListener('click', async () => {
        el('detail').querySelectorAll('.node').forEach((r) => r.classList.remove('active'))
        row.classList.add('active')
        if (!TOKEN) {
          el('node-body').innerHTML = '<p class="empty">该章节正文需要登录后查看（加 <code>&amp;token=</code> 重试）。</p>'
          return
        }
        const data = await get(`/tutorials/${id}/nodes/${row.dataset.node}`)
        el('node-body').innerHTML = data.content || '<p class="empty">该章节暂无正文</p>'
      })
    })
  }

  async function boot() {
    try {
      const home = await get('')
      el('stat-tutorials').textContent = home.stats.total_tutorials
      el('stat-categories').textContent = home.categories.length
      el('stat-announcements').textContent = home.announcements.length

      const items = home.tutorials.items
      if (!items.length) {
        el('list').innerHTML = '<p class="empty">还没有已发布的教程，先去后台发一篇。</p>'
        el('detail').innerHTML = '<p class="empty">—</p>'
        return
      }

      el('list').innerHTML = items
        .map((t) => `<div class="item" data-id="${t.id}"><strong>${esc(t.title)}</strong><span>${esc(t.category || '未分类')}</span></div>`)
        .join('')
      el('list').querySelectorAll('.item').forEach((row) => {
        row.addEventListener('click', () => {
          el('list').querySelectorAll('.item').forEach((r) => r.classList.remove('active'))
          row.classList.add('active')
          openTutorial(row.dataset.id).catch(showError)
        })
      })

      el('list').querySelector('.item').classList.add('active')
      await openTutorial(items[0].id)
    } catch (err) {
      showError(err)
    }
  }

  boot()
</script>
</body>
</html>
