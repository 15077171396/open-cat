# 后台管理端 - Nginx 配置（开源版）
#
# 路由：/admin/ → 管理后台 SPA | /api/ → 后端 | / → 跳转到 /admin/
#
# 与「整套平台」版本的差异：
#   - 删除用户端静态托管（location /）与裸域 301（域名相关）；
#   - 删除 SEO 预渲染：prerender upstream、爬虫 UA 分流 map、@prerender 内部跳转、
#     robots.txt（用户端产物里的文件）；
#   - 删除 Umami 统计的三个 server 块（tj.* 域名、/api/collect 等）。
# 保留：request_id 关联、安全头、gzip、/api 反代、/admin SPA 回退、
#       AI 写作流式端点的关缓冲、sitemap / llms.txt 转发（内容 API 自带，留着不碍事）。

# 缺省时 nginx 只起 1 个 worker，多核机器会闲置
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # 上传体积上限（后端 COS 限制 20MB，这里放行到 25MB 含 multipart 开销）
    client_max_body_size 25m;

    # 访问日志带 request_id：与后端日志的 X-Request-Id 同源，
    # 出问题时能直接从一条 5xx 反查边缘耗时/状态，或在访问日志里找回后端日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time id=$request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # gzip_static：优先发送构建期预压缩的 .gz 产物（vite-plugin-compression2 生成），
    # 省去每次请求实时压缩 1MB 级 vendor chunk 的 CPU；无 .gz 时回退实时压缩
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend {
        server app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        # 开源默认用 localhost。部署到自己的域名时改成实际域名，
        # 并把 .env 的 SITE_BASE_URL / CORS_ORIGINS 一起改。
        server_name localhost;

        # ===== 安全响应头 =====
        # 只声明这 4 个**与资源加载无关**的指令：
        #   object-src 'none'      禁掉 <object>/<embed> 插件面
        #   base-uri 'self'        防注入 <base href="evil"> 劫持相对地址
        #   frame-ancestors 'self' 防点击劫持
        #   form-action 'self'     防表单被改投到外部主机
        #
        # ⚠️ 刻意**不写** default-src / script-src / style-src：未声明的指令不受限，
        # 因此本子集零破坏风险。要收紧需先解决 antd/Quill 的运行时内联样式
        # （style-src 得配 'unsafe-inline' 或 nonce），属于独立一轮的改动。
        # 集中定义为变量：多个 location 各自 add_header（nginx 的 add_header 不继承），
        # 长字符串抄多遍必然漂移。
        set $csp_policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_policy always;

        # ===== API 反向代理 =====
        # AI 写作流式输出：必须关闭缓冲，否则 nginx 会攒满整个响应才下发，
        # 前端表现为「长时间空白后一次性出现结果」。gzip 同理。
        location = /api/v1/admin/ai/writing/run {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 后端据此把日志/错误与本次请求对齐，并在响应头回显
            proxy_set_header X-Request-Id $request_id;
            # AI 接口可能较慢，放宽超时
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ===== 本地存储的上传文件（STORAGE_DRIVER=local 时生效） =====
        # 后端把上传目录挂成 StaticFiles，这里直接反代过去。
        # 用对象存储（cos）时这段不会被访问，留着不影响。
        # 独立 location 是为了单独给长缓存：文件名带 UUID，内容不会变。
        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ===== 管理后台 SPA（/admin/） =====
        # 无尾斜杠的 /admin 落到下面 location / 的 301，先在这里直接处理
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;

            # 入口 HTML 不缓存，保证发版即时生效。
            # ⚠️ 两个入口都要列：`/admin/` 是直接访问，`/admin/index.html` 是
            # try_files 兜底内部跳转的目标（深层链接 /admin/tutorials/1/edit 走这条），
            # 只写前者时后者会被浏览器启发式缓存 → 发版后仍拿旧资源清单 → 白屏。
            # ⚠️ 声明了 add_header 的 location **不再继承** server 级安全头，每个都要重申。
            location = /admin/ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Content-Security-Policy $csp_policy always;
            }
            location = /admin/index.html {
                # 父块用 alias，本块必须显式给 root（alias 不跨 location 继承）
                root /usr/share/nginx/html;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Content-Security-Policy $csp_policy always;
            }
        }

        # ===== 内容 API 的 SEO 端点（无用户端也保留，供搜索引擎与 AI 爬虫抓取） =====
        # 不需要可整段删除。正则 location 中 proxy_pass 不能带 URI，先 rewrite 再反代。
        location = /sitemap.xml {
            proxy_pass http://backend/api/v1/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # 分片站点地图：内容量超过单文件上限时后端输出 /sitemap-2.xml …
        location ~ "^/sitemap-(\d+)\.xml$" {
            rewrite ^ /api/v1/sitemap-$1.xml break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        location = /llms.txt {
            proxy_pass http://backend/api/v1/llms.txt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # IndexNow 验证文件：/{32 位 hex}.txt 由后端吐出密钥内容
        location ~* "^/[a-f0-9]{32}\.txt$" {
            rewrite ^ /api/v1/indexnow-key break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # 根路径直接进后台（本仓库没有用户前台）
        location = / {
            return 302 /admin/;
        }

        location / {
            return 404;
        }
    }
}
