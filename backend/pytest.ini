[pytest]
# warning 治理（缺口台账 P2-57 之二）
#
# 原先 backend/ 里没有任何 pytest 配置，全量跑一次刷 3800+ 条 warning，
# 其中 3494 条来自 pytest-asyncio 在本机 Python 3.14 上的内部 API 弃用，
# 剩下 4 类**真信号**（redis-py setex 弃用、alembic 缺 path_separator、
# pydantic class-based config、aiomysql 连接在已关闭事件循环上被 GC）
# 被完全淹掉 —— 「有 warning」本身不再是信号。
#
# 策略：把可修的两类升级为错误，同时给每条豁免写明**为什么可以豁免**。
# 新增豁免必须带理由，否则等于把治理退回到「大家习惯红着」。
filterwarnings =
    error::DeprecationWarning
    error::RuntimeWarning
    # ① pytest-asyncio × 本机 Python 3.14：第三方内部用法，CI 的 3.11 不触发；
    #    在升级 pytest-asyncio 之前豁免，且它只可能是噪音不可能藏项目缺陷
    ignore:'asyncio\.get_event_loop_policy' is deprecated:DeprecationWarning
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning
    # ② starlette TestClient 要求改装 httpx2：test_validation_log_scrub 那条用例
    #    改写为 httpx.AsyncClient 之前先显式挂账（Warning 类，不在上面两条之内）
    ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning

# 还剩 **1 条** warning：aiomysql 连接在已关闭的事件循环上被 GC（unraisable）。
# 刻意**没有**豁免它 —— 「协程从未 await」「连接泄漏」这类缺陷正是通过 unraisable
# 冒出来的（本轮把 setex 改成 set 时丢掉 13 处 `await`，就是靠同类信号 + 一条断掉的
# 用例发现的）；`ignore::pytest.PytestUnraisableExceptionWarning` 会把这层保护一起关掉。
# 正解是在用到真实引擎的用例里**同一个 loop 内** `dispose_engine()`（生产侧 lifespan 已做），
# 挂在 P2-57 剩余项里。这条 warning 目前是唯一的，出现新的一条就会被看见。
