# Alembic config. NOTE: keep this file ASCII-only - alembic reads it with the
# platform locale encoding (GBK on Windows), so one non-ASCII comment makes every
# alembic command fail with UnicodeDecodeError, and /health/deep then degrades the
# schema-drift check to "unknown". Found during the P2-57 warning cleanup.

[alembic]
script_location = alembic
prepend_sys_path = .

# alembic 2.x wants an explicit path separator; without it alembic falls back to
# splitting on spaces/commas/colons and warns on every run (ledger P2-57).
path_separator = os
sqlalchemy.url = mysql+pymysql://root:root@127.0.0.1:3306/ai_cat?charset=utf8mb4

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
